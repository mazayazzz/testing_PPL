<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Seputar HTML</title>
</head>
<body>
    <h1>Apa saja tag HTML?</h1>
    <p>Ini adalah contoh penggunaan tag HTML dasar.</p>

    <h2>Tag img untuk menampilkan gambar</h2>
    <img src="https://www.w3schools.com/html/img_chania.jpg" alt="Pemandangan" width="300">

    <h2>Tag untuk membuat tabel</h2>
    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <th>Tag</th>
            <th>Kegunaan</th>
        </tr>
        <tr>
            <td>table</td>
            <td>Untuk membuat tabel</td>
        </tr>
        <tr>
            <td>tr</td>
            <td>Untuk membuat baris</td>
        </tr>
        <tr>
            <td>td</td>
            <td>Untuk membuat sel data</td>
        </tr>
    </table>
</body>
</html>
